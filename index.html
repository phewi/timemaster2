<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>TimeMaster2</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&family=Atkinson+Hyperlegible+Mono:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    </style>
</head>

<body class="mode-red">

    <section id="top-section">
        <div id="round-container">
            <div id="round-indicator" class="mono-display">1</div>
            <div id="round-controls">
                <button class="round-btn" onclick="changeRound(-1)">-</button>
                <button class="round-btn" onclick="changeRound(1)">+</button>
            </div>
        </div>
        <div id="shooter-info"></div>
    </section>

    <section id="mid-section" class="mono-display">
        <div class="mid-text" id="mid-text-content">ABCD</div>
    </section>

    <section id="bottom-section" class="mono-display">00:00:00</section>

    <div id="bottom-trigger"></div>
    <div class="bottom-bar" id="bottom-bar">
        <div class="bottom-bar-left">
            <div class="bottom-bar-group">
                <span>Sarjojen määrä:</span>
                <select id="max-rounds-select" onchange="updateMaxRounds()">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6" selected>6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>
            <div class="bottom-bar-group">
                <span>Ammunta-aika:</span>
                <select id="time-select" onchange="saveAllSettings()">
                    <option value="40">40s</option>
                    <option value="80">80s</option>
                    <option value="120" selected>120s</option>
                    <option value="180">180s</option>
                    <option value="240">240s</option>
                </select>
            </div>
            <div class="bottom-bar-group">
                <span>Järjestys:</span>
                <select id="mode-select" onchange="saveAllSettings(); resetToIdle();">
                    <option value="AB" selected>AB</option>
                    <option value="ABC">ABC</option>
                    <option value="A_B">A B</option>
                    <option value="AB_CD">AB CD</option>
                </select>
                <button onclick="toggleOrder()">⇄ Vaihda vuoroa</button>
                <button onclick="openReplay()" style="background: yellow; color: black;">⟳ Uusintanuoli</button>
                <button id="emergency-stop-btn" onclick="toggleEmergencyStop()">Hätäpysäytys</button>
            </div>
            </div>

            <div class="bottom-bar-group">

                

            </div>
            <div class="bottom-bar-group">
                

            </div>
                    <div class="bottom-bar-right">

            
            <button onclick="toggleSettings()">♪ Musiikki</button>
            <button onclick="toggleCombinedSettings()">⚙️Asetukset</button>
            <button onclick="showFirstTimeModal()">❓ Ohje</button>
            <button id="pin-btn" onclick="togglePin()">📌</button>
            
        </div>
        </div>


    </div>

    <div id="settings-panel">
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-size:0.9rem;">Teema:</label>
            <select id="theme-select" onchange="setTheme(this.value)">
                <option value="taustavärit" selected>Taustavärit</option>
                <option value="numerovärit">Numerovärit</option>
            </select>
        </div>
        <div style="margin-bottom:15px;">
            <button onclick="toggleClockHidden()">⏲ Kello päälle/pois</button>
        </div>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-size:0.9rem;">♪ Musiikin äänenvoimakkuus</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume()"
                style="width:100%;">
        </div>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-size:0.9rem;">📢 Äänimerkin äänenvoimakkuus</label>
            <input type="range" id="beep-volume-slider" min="0" max="1" step="0.05" value="0.5"
                oninput="updateBeepVolume()" style="width:100%;">
        </div>
    </div>

    <div id="music-panel">
        
        <div id="playlist-list" style="max-height:220px; overflow-y:auto; ">
        </div>
<div style="display:flex; gap:10px; margin-top:15px; border-top:1px solid #444;">
            <button onclick="togglePlayPause()">♪ Play/Stop</button>
            <button onclick="shufflePlaylist()" style="flex:1;">🔀 Shuffle</button>
            <button onclick="fetchMusicList()" style="flex:1;">Päivitä</button>
        </div>
    </div>

    <!-- First time modal -->
    <div id="first-time-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-heading">TimeMaster2</div>
            <div class="modal-text">
                Vie hiiri alareunaan niin näet asetukset tai käytä pikanäppäimiä
            </div>
            <div class="modal-text">
                Pikanäppäimet:<br>
                <span class="key">A</span> - Asetukset<br>
                <span class="key">S</span> - Musiikki<br>
                <span class="key">K</span> - Kello<br>
                <span class="key">U</span> - Uusintanuoli<br>
                <span class="key">H</span> / <span class="key">Välilyönti</span> - Hätäpysäytys<br>
                <span class="key">Enter</span> - Seuraava
            </div>
            <button class="modal-close-btn" onclick="closeFirstTimeModal()">Sulje</button>
        </div>
    </div>

    <audio id="beep-sound" src="beep.mp3"></audio>
    <audio id="bg-music"></audio>

    <script src="script.js"></script>
</body>
</body>

</html>
