<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>TimeMaster2</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&family=Atkinson+Hyperlegible+Mono:wght@700&display=swap"
        rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Atkinson Hyperlegible', sans-serif;
            font-weight: 700;
            overflow: hidden;
            background-color: #b30000;
            color: white;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .mode-red {
            background-color: #B30000;
        }

        .mode-yellow {
            background-color: #DAA520;
        }

        .mode-green {
            background-color: #008000;
        }

        .mono-display {
            font-family: 'Atkinson Hyperlegible Mono', monospace;
        }

        section {
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        #top-section {
            position: absolute;
            top: 0;
            left: 0;
            height: 25%;
            justify-content: center;
            font-size: 30vh;
            z-index: 10;
        }

        #mid-section {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            justify-content: center;
            z-index: 1;
            white-space: nowrap;
            display: flex;
            align-items: center;
            padding: 0 5vw;
            box-sizing: border-box;
            transition: padding-top 0.3s ease;
        }

        .shooting-active #mid-section {
            align-items: flex-start;
            padding-top: 25vh;
        }

        .mid-text {
            line-height: 0.8;
            font-variant-numeric: tabular-nums;
            text-align: center;
            display: inline-block;
        }

        #bottom-section {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 25%;
            justify-content: center;
            font-size: 22vh;
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        .shooting-mode #bottom-section,
        .clock-hidden #bottom-section {
            opacity: 0;
            pointer-events: none;
        }

        #round-container {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            z-index: 101;
        }

        #round-controls {
            display: flex;
            gap: 15px;
            opacity: 0;
            transition: 0.2s;
            margin-top: -10px;
        }

        #round-container:hover #round-controls {
            opacity: 1;
        }

        .round-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bottom-trigger {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            z-index: 999;
        }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.97);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 1000;
            font-size: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bottom-bar-left,
        .bottom-bar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bottom-bar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #bottom-trigger:hover+.bottom-bar,
        .bottom-bar:hover,
        .bottom-bar.pinned {
            transform: translateY(0);
        }

        select,
        button {
            font-family: inherit;
            font-size: 1rem;
            padding: 8px;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
            font-weight: 700;
        }

        #emergency-stop-btn {
            background: #ff0000;
            color: white;
        }

        .emergency-stop #mid-text-content {
            font-size: 65vh !important;
            letter-spacing: 0.02em;
            line-height: 0.85;
        }

        .emergency-stop #mid-section {
            align-items: center;
        }

        .emergency-stop #bottom-section {
            opacity: 0;
            pointer-events: none;
        }

        #pin-btn.active {
            color: #007bff;
            background: #111;
        }

        button:disabled {
            color: grey;
            cursor: not-allowed;
        }

        #settings-panel {
            position: absolute;
            right: 15px;
            bottom: 90px;
            width: 350px;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid #444;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            padding: 20px;
            z-index: 1001;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid #444;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            text-align: center;
            color: white;
        }

        .modal-heading {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .modal-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .modal-close-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        .key {
            background-color: black;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
    </style>
</head>

<body class="mode-red">

    <section id="top-section">
        <div id="round-container">
            <div id="round-indicator" class="mono-display">1</div>
            <div id="round-controls">
                <button class="round-btn" onclick="changeRound(-1)">-</button>
                <button class="round-btn" onclick="changeRound(1)">+</button>
            </div>
        </div>
        <div id="shooter-info"></div>
    </section>

    <section id="mid-section" class="mono-display">
        <div class="mid-text" id="mid-text-content">ABCD</div>
    </section>

    <section id="bottom-section" class="mono-display">00:00:00</section>

    <div id="bottom-trigger"></div>
    <div class="bottom-bar" id="bottom-bar">
        <div class="bottom-bar-left">
            <div class="bottom-bar-group">
                <span>Sarjojen määrä:</span>
                <select id="max-rounds-select" onchange="updateMaxRounds()">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6" selected>6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>
            <div class="bottom-bar-group">
                <span>Ammunta-aika:</span>
                <select id="time-select" onchange="saveAllSettings()">
                    <option value="120" selected>120s</option>
                    <option value="180">180s</option>
                    <option value="240">240s</option>
                </select>
            </div>
            <div class="bottom-bar-group">
                <span>Järjestys:</span>
                <select id="mode-select" onchange="saveAllSettings(); resetToIdle();">
                    <option value="AB" selected>AB</option>
                    <option value="ABC">ABC</option>
                    <option value="A_B">A B</option>
                    <option value="AB_CD">AB CD</option>
                </select>
                <button onclick="toggleOrder()">⇄ Vaihda vuoroa</button>
            </div>


            <div class="bottom-bar-group">

                <button onclick="openReplay()" style="background: yellow; color: black;">⟳ Uusintanuoli</button>

            </div>
            <div class="bottom-bar-group">
                <button id="emergency-stop-btn" onclick="toggleEmergencyStop()">Hätäpysäytys</button>

            </div>
        </div>

        <div class="bottom-bar-right">
            <button onclick="toggleClockHidden()">⏲ Kello</button>

            <button onclick="togglePlayPause()">♪ Musiikki päälle/pois</button>
            <button onclick="toggleSettings()">≡ Soittolista</button>
            <button id="pin-btn" onclick="togglePin()">📌</button>
        </div>
    </div>

    <div id="settings-panel">
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-size:0.9rem;">♪ Musiikin äänenvoimakkuus</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume()"
                style="width:100%;">
        </div>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-size:0.9rem;">📢 Piippauksen äänenvoimakkuus</label>
            <input type="range" id="beep-volume-slider" min="0" max="1" step="0.05" value="0.5"
                oninput="updateBeepVolume()" style="width:100%;">
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="shufflePlaylist()" style="flex:1;">🔀 Shuffle</button>
            <button onclick="fetchMusicList()" style="flex:1;">Päivitä</button>
        </div>
        <div id="playlist-list" style="max-height:180px; overflow-y:auto; margin-top:15px; border-top:1px solid #444;">
        </div>
    </div>

    <!-- First time modal -->
    <div id="first-time-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-heading">TimeMaster2</div>
            <div class="modal-text">
                Vie hiiri alareunaan niin näet asetukset tai käytä pikanäppäimiä
            </div>
            <div class="modal-text">
                Pikanäppäimet:<br>
                <span class="key">A</span> - Asetukset<br>
                <span class="key">S</span> - Musiikki<br>
                <span class="key">K</span> - Kello<br>
                <span class="key">U</span> - Uusintanuoli<br>
                <span class="key">H</span> / <span class="key">Välilyönti</span> - Hätäpysäytys<br>
                <span class="key">Enter</span> - Seuraava
            </div>
            <button class="modal-close-btn" onclick="closeFirstTimeModal()">Sulje</button>
        </div>
    </div>

    <audio id="beep-sound" src="beep.mp3"></audio>
    <audio id="bg-music"></audio>

    <script>
        let timeLeft = 0, timerInterval = null, roundNum = 1, currentStep = 'IDLE';
        let isOrderSwapped = false, isPinned = false, isClockHidden = true;
        let isEmergencyStop = false, emergencyInterval = null, emergencyPrevStep = 'IDLE';
        let musicFiles = [], currentTrackIdx = 0;
        let isMusicPlayingBeforePrep = false, musicToggleOn = false;
        let maxRounds = 12;

        const musicPlayer = document.getElementById('bg-music');
        const beepSound = document.getElementById('beep-sound');

        musicPlayer.addEventListener('ended', () => nextSong());

        function fitText() {
            const text = document.getElementById('mid-text-content');
            const isShooting = currentStep !== 'IDLE';
            let maxHFactor = 0.6;
            if (isShooting) maxHFactor = 0.75;
            else if (isClockHidden) maxHFactor = 0.9;
            const maxHeight = window.innerHeight * maxHFactor;
            const maxWidth = window.innerWidth * 0.9;
            text.style.fontSize = '100px';
            const optimalSize = 100 * Math.min(maxWidth / text.offsetWidth, maxHeight / text.offsetHeight);
            text.style.fontSize = Math.floor(optimalSize) + 'px';
        }

        window.addEventListener('resize', fitText);

        function saveAllSettings() {
            localStorage.setItem('tm2_final_config', JSON.stringify({
                mode: document.getElementById('mode-select').value,
                time: document.getElementById('time-select').value,
                maxRounds: document.getElementById('max-rounds-select').value,
                pin: isPinned,
                round: roundNum,
                vol: document.getElementById('volume-slider').value,
                beepVol: document.getElementById('beep-volume-slider').value,
                swapped: isOrderSwapped,
                clockHidden: isClockHidden,
                musicOrder: musicFiles,
                musicToggleOn: musicToggleOn
            }));
        }

        function loadSettings() {
            const s = JSON.parse(localStorage.getItem('tm2_final_config') || '{}');
            if (s.mode) document.getElementById('mode-select').value = s.mode;
            document.getElementById('time-select').value = s.time || '120';
            document.getElementById('max-rounds-select').value = s.maxRounds || '12';
            maxRounds = parseInt(s.maxRounds || '12');
            if (s.pin) { isPinned = true; document.getElementById('bottom-bar').classList.add('pinned'); document.getElementById('pin-btn').classList.add('active'); }
            if (s.clockHidden !== undefined) { isClockHidden = s.clockHidden; }
            if (s.musicOrder) musicFiles = s.musicOrder;
            if (s.musicToggleOn !== undefined) musicToggleOn = s.musicToggleOn;
            roundNum = s.round || 1;
            isOrderSwapped = s.swapped || false;
            document.getElementById('round-indicator').innerText = roundNum;
            document.getElementById('volume-slider').value = s.vol || 0.5;
            document.getElementById('beep-volume-slider').value = s.beepVol || 0.5;
            updateVolume();
            updateBeepVolume();
            updateDisplay();
            resetToIdle();
            updateMusicButton();
        }

        function updateDisplay() {
            const mode = document.getElementById('mode-select').value;
            const topText = document.getElementById('shooter-info');
            const midText = document.getElementById('mid-text-content');

            document.body.classList.remove('shooting-mode', 'clock-hidden', 'shooting-active', 'emergency-stop');
            document.body.classList.remove('mode-red', 'mode-yellow', 'mode-green');
            if (currentStep === 'STOP') {
                document.body.classList.add('mode-red', 'emergency-stop');
            } else if (currentStep === 'P1_PREP' || currentStep === 'P2_PREP') {
                document.body.classList.add('shooting-mode', 'shooting-active', 'mode-red');
            } else if (currentStep === 'P1_SHOOT' || currentStep === 'P2_SHOOT') {
                document.body.classList.add('shooting-mode', 'shooting-active');
                if (timeLeft <= 30) {
                    document.body.classList.add('mode-yellow');
                } else {
                    document.body.classList.add('mode-green');
                }
            } else if (isClockHidden) {
                document.body.classList.add('mode-red', 'clock-hidden');
            } else {
                document.body.classList.add('mode-red');
            }

            if (currentStep === 'STOP') {
                topText.innerText = '';
                midText.innerText = 'STOP';
                midText.style.fontSize = '65vh';
                midText.style.lineHeight = '0.85';
            } else {
                midText.style.fontSize = '';
                midText.style.lineHeight = '';
                if (currentStep === 'IDLE') {
                    topText.innerText = "";
                    midText.innerText = (mode === 'AB_CD') ? (isOrderSwapped ? "CDAB" : "ABCD") : (mode === 'ABC' ? "ABC" : (mode === 'AB' ? "AB" : (isOrderSwapped ? "B A" : "A B")));
                } else {
                    midText.innerText = timeLeft.toString();
                    topText.innerText = (mode === 'AB_CD') ? (currentStep.includes('P1') ? (isOrderSwapped ? "CD" : "AB") : (isOrderSwapped ? "AB" : "CD")) : (mode === 'ABC' ? "ABC" : (mode === 'AB' ? "AB" : (currentStep.includes('P1') ? (isOrderSwapped ? "B" : "A") : (isOrderSwapped ? "A" : "B"))));
                }
                setTimeout(fitText, 0);
            }

            // Update button states
            const toggleOrderBtn = document.querySelector('button[onclick="toggleOrder()"]');
            toggleOrderBtn.disabled = !(mode === 'A_B' || mode === 'AB_CD');
        }

        function updateClock() {
            const clockElement = document.getElementById('bottom-section');
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockElement.innerText = `${hours}:${minutes}:${seconds}`;
        }

        function shufflePlaylist() {
            for (let i = musicFiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [musicFiles[i], musicFiles[j]] = [musicFiles[j], musicFiles[i]];
            }
            renderPlaylist();
            saveAllSettings();
        }

        async function handleNext() {
            const mode = document.getElementById('mode-select').value;
            if (currentStep === 'IDLE') startPrep(1);
            else if (currentStep === 'P1_PREP') startShooting(1);
            else if (currentStep === 'P1_SHOOT') (mode === 'AB' || mode === 'ABC') ? finishRound() : startPrep(2);
            else if (currentStep === 'P2_PREP') startShooting(2);
            else if (currentStep === 'P2_SHOOT') finishRound();
        }

        async function startPrep(p) {
            clearInterval(timerInterval);
            isMusicPlayingBeforePrep = musicToggleOn && !musicPlayer.paused;
            if (!musicPlayer.paused) musicPlayer.pause();
            currentStep = p === 1 ? 'P1_PREP' : 'P2_PREP';
            timeLeft = 10; updateDisplay(); playBeeps(2);
            timerInterval = setInterval(() => { timeLeft--; if (timeLeft <= 0) startShooting(p); updateDisplay(); }, 1000);
        }

        async function startShooting(p) {
            clearInterval(timerInterval);
            currentStep = p === 1 ? 'P1_SHOOT' : 'P2_SHOOT';
            timeLeft = parseInt(document.getElementById('time-select').value);
            updateDisplay();
            playBeeps(1);
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    const mode = document.getElementById('mode-select').value;
                    if (p === 1 && mode !== 'AB' && mode !== 'ABC') startPrep(2);
                    else finishRound();
                }
                updateDisplay();
            }, 1000);
        }

        function finishRound() {
            clearInterval(timerInterval);
            currentStep = 'IDLE';
            playBeeps(3);

            // Check if we've reached max rounds
            if (roundNum >= maxRounds) {
                roundNum = 1;
            } else {
                roundNum++;
            }
            document.getElementById('round-indicator').innerText = roundNum;

            const mode = document.getElementById('mode-select').value;
            if (mode === 'AB_CD' || mode === 'A_B') isOrderSwapped = !isOrderSwapped;
            updateDisplay();
            saveAllSettings();

            setTimeout(() => {
                if (musicToggleOn && musicFiles.length > 0) {
                    nextSong();
                }
            }, 4000);
        }

        function updateMusicButton() {
            const btn = document.querySelector('button[onclick="togglePlayPause()"]');
            if (musicPlayer.paused) {
                btn.innerText = '▶️ Musiikki';
            } else {
                btn.innerText = '⏹️ Musiikki';
            }
        }

        function toggleEmergencyStop() {
            if (isEmergencyStop) {
                deactivateEmergencyStop();
            } else {
                activateEmergencyStop();
            }
        }

        function activateEmergencyStop() {
            if (isEmergencyStop) return;
            isEmergencyStop = true;
            emergencyPrevStep = currentStep;
            clearInterval(timerInterval);
            currentStep = 'STOP';
            updateDisplay();
            beepSound.currentTime = 0;
            beepSound.play();
            emergencyInterval = setInterval(() => {
                beepSound.currentTime = 0;
                beepSound.play();
            }, 2000);
        }

        function deactivateEmergencyStop() {
            if (!isEmergencyStop) return;
            isEmergencyStop = false;
            clearInterval(emergencyInterval);
            emergencyInterval = null;
            currentStep = emergencyPrevStep || 'IDLE';
            if (currentStep === 'IDLE') {
                updateDisplay();
            } else {
                resumeCurrentPhase();
            }
        }

        function resumeCurrentPhase() {
            if (currentStep === 'P1_PREP' || currentStep === 'P2_PREP') {
                updateDisplay();
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) startShooting(currentStep === 'P1_PREP' ? 1 : 2);
                    updateDisplay();
                }, 1000);
            } else if (currentStep === 'P1_SHOOT' || currentStep === 'P2_SHOOT') {
                updateDisplay();
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        const mode = document.getElementById('mode-select').value;
                        if (currentStep === 'P1_SHOOT' && mode !== 'AB' && mode !== 'ABC') startPrep(2);
                        else finishRound();
                    }
                    updateDisplay();
                }, 1000);
            } else {
                updateDisplay();
            }
        }

        function togglePlayPause() {
            if (currentStep !== 'IDLE') return;
            if (!musicPlayer.paused) {
                musicPlayer.pause();
                musicToggleOn = false;
            } else {
                musicToggleOn = true;
                nextSong();
            }
            saveAllSettings();
            renderPlaylist();
            updateMusicButton();
        }

        function playTrack(idx) {
            if (currentStep !== 'IDLE') return;
            currentTrackIdx = idx;
            musicPlayer.src = 'musiikki/' + encodeURIComponent(musicFiles[currentTrackIdx]);
            musicToggleOn = true;
            musicPlayer.play();
            saveAllSettings();
            renderPlaylist();
            updateMusicButton();
        }

        function nextSong() {
            if (musicFiles.length === 0) return;
            currentTrackIdx = (currentTrackIdx + 1) % musicFiles.length;
            playTrack(currentTrackIdx);
        }

        async function fetchMusicList() {
            try {
                // Try dynamic endpoint first (for local server.py)
                const r = await fetch('/api/music');
                musicFiles = await r.json();
                renderPlaylist();
            } catch (e) {
                // Fall back to static JSON (for GitHub Pages)
                try {
                    const r = await fetch('api/music.json');
                    musicFiles = await r.json();
                    renderPlaylist();
                } catch (e2) { }
            }
        }

        function renderPlaylist() {
            const l = document.getElementById('playlist-list'); l.innerHTML = '';
            musicFiles.forEach((f, i) => {
                const d = document.createElement('div');
                d.innerText = (i + 1) + ". " + f;
                d.style.padding = '8px'; d.style.cursor = 'pointer';
                d.style.color = (i === currentTrackIdx && !musicPlayer.paused) ? '#00ff00' : 'white';
                d.onclick = () => { if (currentStep === 'IDLE') playTrack(i); };
                l.appendChild(d);
            });
        }

        function updateVolume() { musicPlayer.volume = document.getElementById('volume-slider').value; saveAllSettings(); }
        function updateBeepVolume() { beepSound.volume = document.getElementById('beep-volume-slider').value; saveAllSettings(); }
        function updateMaxRounds() { maxRounds = parseInt(document.getElementById('max-rounds-select').value); saveAllSettings(); }
        function toggleOrder() { isOrderSwapped = !isOrderSwapped; updateDisplay(); saveAllSettings(); }
        function togglePin() { isPinned = !isPinned; document.getElementById('bottom-bar').classList.toggle('pinned', isPinned); document.getElementById('pin-btn').classList.toggle('active', isPinned); saveAllSettings(); }
        function toggleSettings() { const p = document.getElementById('settings-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }

        function toggleClockHidden() {
            isClockHidden = !isClockHidden;
            updateDisplay();
            saveAllSettings();
        }

        function resetToIdle() {
            clearInterval(timerInterval);
            currentStep = 'IDLE';
            if (musicToggleOn && musicFiles.length > 0) nextSong();
            updateDisplay();
        }

        function changeRound(v) { roundNum = Math.max(1, roundNum + v); document.getElementById('round-indicator').innerText = roundNum; saveAllSettings(); }
        async function playBeeps(c) { await new Promise(r => setTimeout(r, 250)); for (let i = 0; i < c; i++) { beepSound.currentTime = 0; beepSound.play(); await new Promise(r => setTimeout(r, 1200)); } }

        window.addEventListener('keydown', e => {
            const isEmergencyKey = e.key.toLowerCase() === 'h' || e.code === 'Space';
            if (isEmergencyStop && !isEmergencyKey) {
                e.preventDefault();
                return;
            }

            if (e.key === 'Enter') handleNext();
            if (e.key.toLowerCase() === 's' && currentStep === 'IDLE') togglePlayPause();
            if (e.key.toLowerCase() === 'u') openReplay();
            if (e.key.toLowerCase() === 'k' && currentStep === 'IDLE') {
                isClockHidden = !isClockHidden;
                updateDisplay();
                saveAllSettings();
            }
            if (e.key.toLowerCase() === 'a') togglePin();
            if (isEmergencyKey) {
                e.preventDefault();
                toggleEmergencyStop();
            }
        });

        fetchMusicList();
        updateClock();
        setInterval(updateClock, 1000);
        loadSettings();

        // Check for first time
        if (!localStorage.getItem('firstTimeShown')) {
            document.getElementById('first-time-modal').style.display = 'flex';
        }

        function closeFirstTimeModal() {
            document.getElementById('first-time-modal').style.display = 'none';
            localStorage.setItem('firstTimeShown', 'true');
        }

        function openReplay() {
            const width = window.screen.width;
            const height = window.screen.height;
            window.open('uusinta.html', '_blank', `width=${width},height=${height},fullscreen=yes,location=no,menubar=no,toolbar=no`);
        }

        document.addEventListener('click', (event) => {
            const panel = document.getElementById('settings-panel');
            const settingsBtn = document.querySelector('button[onclick="toggleSettings()"]');
            if (panel.style.display === 'flex' && !panel.contains(event.target) && event.target !== settingsBtn) {
                panel.style.display = 'none';
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data.action === 'stopMusic') {
                if (!musicPlayer.paused) musicPlayer.pause();
                updateMusicButton();
                renderPlaylist();
            } else if (event.data.action === 'resumeMusic') {
                setTimeout(() => {
                    if (musicToggleOn && musicFiles.length > 0) {
                        nextSong();
                    }
                }, 4000);
            }
        });
    </script>
</body>

</html>
